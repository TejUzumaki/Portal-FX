<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Air-Touch Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 10px; }
        p { color: #aaa; margin-bottom: 30px; text-align: center; }
        .btn { width: 100%; max-width: 300px; padding: 25px; font-size: 1.4rem; border: none; border-radius: 15px; cursor: pointer; margin-bottom: 15px; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        .start { background: #00C853; color: #000; font-weight: bold; }
        .start:active { background: #009624; transform: scale(0.95); }
        .stop { background: #D50000; color: #fff; font-weight: bold; }
        .stop:active { background: #B71C1C; transform: scale(0.95); }
        #status { margin-top: 20px; padding: 10px; border-radius: 8px; background: #1E1E1E; width: 100%; max-width: 300px; text-align: center; }
    </style>
</head>
<body>
    <h1>Air-Touch</h1>
    <p>Use your index finger in front of the back camera to move the cursor.</p>
    
    <button class="btn start" onclick="control('start')">START TRACKING</button>
    <button class="btn stop" onclick="control('stop')">STOP TRACKING</button>
    
    <div id="status">Status: Idle</div>

    <script>
        async function control(action) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "Status: Loading...";
            try {
                const res = await fetch(`/${action}`, { method: 'POST' });
                const data = await res.json();
                statusDiv.innerText = `Status: ${data.status}`;
            } catch (e) {
                statusDiv.innerText = "Status: Error";
            }
        }
    </script>
</body>
</html>
