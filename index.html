<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air-Touch CAD</title>
    <link rel="stylesheet" href="style.css">
    <script src="/assets/hands.js"></script>
</head>
<body>
    <div id="loader">
        <div id="load-percent">0%</div>
        <div id="load-step">Initializing</div>
        <div id="load-bar-bg"><div id="load-bar"></div></div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    
    <div id="status-box" style="max-width: 300px; font-size: 12px; line-height: 1.4;">
        <div id="status">SYSTEM READY</div>
        <div id="mode" style="color: #ff00ff; font-size: 16px; font-weight: bold; margin-bottom: 5px;">CURSOR MODE</div>
        <div id="debug" style="color: #888; word-break: break-all;"></div>
    </div>
    
    <button id="btn-cam" class="hud-btn" onclick="switchCamera()">Switch Cam</button>
    <button id="btn-ar" class="hud-btn" style="top: 80px; right: 20px; border-color: #ff00ff; color: #ff00ff;" onclick="toggleAR()">AR: OFF</button>
    <button id="init-tracking-btn" onclick="initializeHandTracking()">Initialize Hand Tracking</button>

    <script>
        const video = document.getElementById('video');
        const statusDiv = document.getElementById("status");
        const modeDiv = document.getElementById("mode");
        const debugDiv = document.getElementById("debug");
        const statusBox = document.getElementById("status-box");
        const loader = document.getElementById('loader');
        const loadPercent = document.getElementById('load-percent');
        const loadStep = document.getElementById('load-step');
        const loadBar = document.getElementById('load-bar');
        const btnAr = document.getElementById('btn-ar');
        const initBtn = document.getElementById('init-tracking-btn');
        
        let currentFacing = 'user', Engine, handsInstance = null; 
        let smoothX = 0.5, smoothY = 0.5;
        const LERP = 0.45;
        
        let handLostTime = null, lastHeartbeat = 0, isRecovering = false;
        let hoveredObj = null, grabbedObj = null, lastGrabPos3D = null, extrudeThreshold = 0;
        let isDrawing = false;
        let activeLine = [];

        // GESTURE STATE MACHINE
        let currentMode = 'cursor';
        let isPinching = false;
        const PINCH_ON = 0.05, PINCH_OFF = 0.1, DRAW_PINCH_ON = 0.03, DRAW_PINCH_OFF = 0.08;

        function isFingerExtended(lm, tip, mcp) { return lm[tip].y < lm[mcp].y; }

        function detectGestures(lm) {
            const indexExt = isFingerExtended(lm, 8, 5);
            const middleExt = isFingerExtended(lm, 12, 9);
            const ringExt = isFingerExtended(lm, 16, 13);
            const pinkyExt = isFingerExtended(lm, 20, 17);
            
            const dx = lm[8].x - lm[4].x, dy = lm[8].y - lm[4].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const isPinch = dist < (currentMode === 'draw' ? DRAW_PINCH_ON : PINCH_ON);

            if (!indexExt && !middleExt && !ringExt && !pinkyExt) return { gesture: 'FIST', isPinch: false };
            if (indexExt && middleExt && !ringExt && !pinkyExt) return { gesture: 'PEACE', isPinch };
            if (indexExt && !middleExt && !ringExt && !pinkyExt) return { gesture: 'POINT', isPinch };
            return { gesture: 'UNKNOWN', isPinch };
        }

        async function robustGetUserMedia(c) {
            if (video.srcObject) { video.srcObject.getTracks().forEach(t => { t.stop(); t.onended = null; }); video.srcObject = null; }
            try { return await navigator.mediaDevices.getUserMedia(c); }
            catch (err) { await new Promise(r => setTimeout(r, 1500)); return await navigator.mediaDevices.getUserMedia(c); }
        }

        async function toggleAR() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { if ((await DeviceOrientationEvent.requestPermission()) !== 'granted') return; } catch(e) {}
            }
            if (btnAr.innerText === "AR: OFF") {
                btnAr.innerText = "AR: ON"; btnAr.style.background = "rgba(255, 0, 255, 0.2)";
                window.addEventListener('deviceorientation', e => { if (e.beta !== null) Engine.updateGyroscope(e.beta, e.gamma); });
                statusDiv.innerText = "SPATIAL LOCKED"; statusDiv.style.color = "#ff00ff";
            } else {
                btnAr.innerText = "AR: OFF"; btnAr.style.background = "rgba(0, 0, 0, 0.5)";
                window.removeEventListener('deviceorientation', e => { if (e.beta !== null) Engine.updateGyroscope(e.beta, e.gamma); });
                statusDiv.innerText = "SPATIAL UNLOCKED"; statusDiv.style.color = "#00ffff";
            }
            Engine[btnAr.innerText === "AR: ON" ? 'enableAR' : 'disableAR']();
        }

        function onResults(results) {
            lastHeartbeat = Date.now();
            try {
                if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                    if (isDrawing) {
                        if (!handLostTime) handLostTime = Date.now();
                        else if (Date.now() - handLostTime > 1000) { Engine.finishLine(); isDrawing = false; handLostTime = null; }
                    }
                    debugDiv.innerText = "No hands"; return; 
                } 
                
                handLostTime = null;
                const lm = results.multiHandLandmarks[0];
                const { gesture, isPinch: newPinchState } = detectGestures(lm);
                
                // Pinch Hysteresis
                const pOff = currentMode === 'draw' ? DRAW_PINCH_OFF : PINCH_OFF;
                if (newPinchState && !isPinching) isPinching = true;
                else if (!newPinchState && isPinching && gesture !== 'FIST') isPinching = false;

                // Auto-Switch Modes
                if (gesture === 'PEACE' && currentMode !== 'draw') { currentMode = 'draw'; modeDiv.innerText = "DRAW MODE"; modeDiv.style.color = "#ff00ff"; }
                else if (gesture === 'POINT' && currentMode !== 'cursor') { if(isDrawing){Engine.finishLine(); isDrawing=false;} currentMode = 'cursor'; modeDiv.innerText = "CURSOR MODE"; modeDiv.style.color = "#00ffff"; }
                else if (gesture === 'FIST' && currentMode !== 'grab') { if(isDrawing){Engine.finishLine(); isDrawing=false;} currentMode = 'grab'; modeDiv.innerText = "GRAB MODE"; modeDiv.style.color = "#ff8800"; }

                const indexTip = lm[8];
                smoothX += (indexTip.x - smoothX) * LERP; smoothY += (indexTip.y - smoothY) * LERP;
                
                // Engine expects strict 2D coordinates for worldToLocal math
                const pos3D = Engine.screenTo3D(smoothX, smoothY); 
                Engine.updateCursor(pos3D);

                if (currentMode === 'draw') handleDrawMode(pos3D, gesture);
                else if (currentMode === 'grab') handleGrabMode(pos3D, gesture);
                else handleCursorMode(pos3D, gesture);

                debugDiv.innerText = `${gesture} | P: ${isPinching}`;
            } catch (e) { debugDiv.innerHTML = `<span style="color:red">ERR: ${e.message}</span>`; }
        }

        function handleDrawMode(pos3D, gesture) {
            Engine.setCursorColor(isPinching ? 0x00ffff : 0xff00ff);
            if (!isPinching) {
                if (!isDrawing) { isDrawing = true; Engine.startDrawing(pos3D); }
                else { Engine.continueDrawing(pos3D); }
                statusDiv.innerText = "DRAWING"; statusDiv.style.color = "#ff00ff";
            } else {
                if (isDrawing) { Engine.finishLine(); isDrawing = false; statusDiv.innerText = "LINE SAVED"; statusDiv.style.color = "#00ff41"; }
                else statusDiv.innerText = "PEN UP"; statusDiv.style.color = "#00ffff";
            }
        }

        function handleCursorMode(pos3D, gesture) {
            Engine.setCursorColor(isPinching ? 0xff0055 : 0x00ffff);
            if (isPinching) { statusDiv.innerText = "TAP"; statusDiv.style.color = "#ff0055"; }
            else { statusDiv.innerText = "CURSOR"; statusDiv.style.color = "#00ffff"; }
        }

        function handleGrabMode(pos3D, gesture) {
            // USE THE CORRECT FUNCTION NAME: getSceneObjects2D
            const objects = Engine.getSceneObjects2D();
            let found = null;
            
            for (let obj of objects) {
                if (smoothX >= obj.minX && smoothX <= obj.maxX && smoothY >= obj.minY && smoothY <= obj.maxY) {
                    found = obj.id; break;
                }
            }

            if (grabbedObj) {
                Engine.setCursorColor(0xff0000);
                const delta = pos3D.clone().sub(lastGrabPos3D);
                
                if ((grabbedObj.type === 'square' || grabbedObj.type === 'circle') && !grabbedObj.mesh && isPinching) {
                    extrudeThreshold += (-delta.y); 
                    if (extrudeThreshold > 0.3) { Engine.extrudeObject(grabbedObj, 0.5); statusDiv.innerText = "EXTRUDED!"; statusDiv.style.color = "#00ff41"; extrudeThreshold = 0; }
                }

                Engine.moveObject(grabbedObj, pos3D); lastGrabPos3D = pos3D.clone();
                statusDiv.innerText = "DRAGGING"; statusDiv.style.color = "#ff0000";

                if (gesture !== 'FIST') {
                    Engine.highlightObject(grabbedObj, false);
                    grabbedObj = null; extrudeThreshold = 0;
                    statusDiv.innerText = "DROPPED"; statusDiv.style.color = "#ff8800";
                }
            } else {
                if (found !== hoveredObj) {
                    if (hoveredObj) Engine.highlightObject(hoveredObj, false);
                    hoveredObj = found;
                    if (hoveredObj) Engine.highlightObject(hoveredObj, true);
                }

                if (hoveredObj) {
                    Engine.setCursorColor(0xffff00);
                    if (gesture === 'FIST') {
                        grabbedObj = hoveredObj; lastGrabPos3D = pos3D.clone(); extrudeThreshold = 0;
                        statusDiv.innerText = `LOCKED [${grabbedObj.type.toUpperCase()}]`; statusDiv.style.color = "#ff0000";
                    } else {
                        let hint = "Close fist to grab";
                        if ((hoveredObj.type === 'square' || hoveredObj.type === 'circle') && !hoveredObj.mesh) hint += " | Pinch & Pull up";
                        statusDiv.innerText = `HOVER: ${hint}`; statusDiv.style.color = "#ffff00";
                    }
                } else {
                    Engine.setCursorColor(0xff8800);
                    statusDiv.innerText = "GRAB MODE (Point inside shape)"; statusDiv.style.color = "#ff8800";
                }
            }
        }

        async function initializeHandTracking() { initBtn.innerText = "COMPILING..."; initBtn.style.pointerEvents = 'none'; await buildMediaPipe(); }

        async function buildMediaPipe() {
            try {
                if (handsInstance) { try { await handsInstance.close(); } catch(e){} handsInstance = null; }
                handsInstance = new Hands({ locateFile: (file) => `/assets/${file}` });
                handsInstance.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
                handsInstance.onResults(onResults);
                lastHeartbeat = Date.now(); isRecovering = false;
                initBtn.style.display = 'none'; statusDiv.innerText = "AI ONLINE"; statusDiv.style.color = "#00ff41";
                processFrame();
            } catch (err) { debugDiv.innerHTML = `<span style="color:red">FATAL: ${err.message}</span>`; isRecovering = false; }
        }

        async function processFrame() {
            if (!isRecovering && (Date.now() - lastHeartbeat) > 2500) {
                isRecovering = true; debugDiv.innerHTML = "<span style='color:#ff8800'>REBOOTING...</span>";
                await new Promise(r => setTimeout(r, 2000)); await buildMediaPipe(); return;
            }
            if (!isRecovering) {
                try { if (video.readyState >= 2 && handsInstance) await handsInstance.send({ image: video }); }
                catch (err) { lastHeartbeat = 0; }
            }
            requestAnimationFrame(processFrame);
        }

        async function switchCamera() {
            currentFacing = currentFacing === 'user' ? 'environment' : 'user';
            video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
            document.getElementById('three-canvas').style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
            try { const stream = await robustGetUserMedia({ video: { facingMode: currentFacing, width: {ideal: 640}, height: {ideal: 480}}}); video.srcObject = stream; await video.play(); } 
            catch(e) { debugDiv.innerHTML = `<span style="color:red">CAM ERR</span>`; }
        }

        async function boot() {
            try {
                loadPercent.innerText = '20%'; loadStep.innerText = 'Loading Engine';
                Engine = await import('./js/three-engine.js'); Engine.initThree();
                loadPercent.innerText = '60%'; loadStep.innerText = 'Starting Camera';
                const stream = await robustGetUserMedia({ video: { facingMode: currentFacing, width: { ideal: 320 }, height: { ideal: 240 } }});
                video.srcObject = stream; await video.play();
                video.style.display = 'block'; if (currentFacing === 'user') video.style.transform = 'scaleX(-1)';
                loader.style.display = 'none'; statusBox.style.opacity = '1';
            } catch (err) { loadPercent.innerText = 'ERROR'; loadStep.innerText = err.message; loadPercent.style.color = '#ff0055'; }
        }
        boot();
    </script>
</body>
</html>
