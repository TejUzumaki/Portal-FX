<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal FX</title>
    <link rel="stylesheet" href="style.css">
    <script src="/assets/hands.js"></script>
</head>
<body>
    <div id="rotate-overlay">
        <svg class="rotate-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"></rect><line x1="12" y1="18" x2="12" y2="18"></line></svg>
        <div class="rotate-text">Rotate to Landscape</div>
    </div>

    <div id="loader">
        <div class="load-content">
            <div id="load-percent">0%</div>
            <div id="load-step">Initializing</div>
            <div id="load-bar-bg"><div id="load-bar"></div></div>
        </div>
        <div id="tejas-footer">
            Portal FX<br>Made by Tejas — Enjoy the Effects
        </div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="ui-layer">
        <div id="status-box">
            <div id="status">FX: NONE | INTENSITY: 0%</div>
            <div id="mode">STATE: IDLE</div>
        </div>

        <button id="btn-cam" class="hud-btn" onclick="switchCamera()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </button>

        <button id="init-btn" onclick="initializeHandTracking()">Initiate</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const loader = document.getElementById('loader');
        const initBtn = document.getElementById('init-btn');
        const statusBox = document.getElementById('status-box');
        const statusDiv = document.getElementById("status");
        const modeDiv = document.getElementById("mode");
        const rotateOverlay = document.getElementById('rotate-overlay');

        let currentFacing = 'user', handsInstance = null;
        let lastHeartbeat = 0, isRecovering = false;
        let currentEffect = 0; 
        const effectNames = ["THERMAL", "INVERT", "ASCII", "CARTOON PIXEL", "MANGA HALFTONE"];
        let lastCycleAngle = 0;
        let idleTimer = null;

        // Freeze State
        let isFrozen = false;
        let frozenPts = [];
        let lastTapTime = 0;
        let tapCooldown = false;

        // Adaptive Resolution
        let renderScale = 1.0;
        let frameTimes = [];
        let lastFrameTime = performance.now();

        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
        const tinyCanvas = document.createElement('canvas');
        const tinyCtx = tinyCanvas.getContext('2d', { willReadFrequently: true });

        const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];

        function checkOrientation() {
            if (window.innerHeight > window.innerWidth) {
                rotateOverlay.classList.add('show');
                initBtn.style.display = 'none';
            } else {
                rotateOverlay.classList.remove('show');
                if (!handsInstance) initBtn.style.display = 'block';
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            offCanvas.width = window.innerWidth; offCanvas.height = window.innerHeight;
            tinyCanvas.width = 160; tinyCanvas.height = 120;
            checkOrientation();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function isFingerExt(lm, tip, pip) { return lm[tip].y < lm[pip].y - 0.02; }

        function randomizeEffect() {
            let next = currentEffect;
            while(next === currentEffect) next = Math.floor(Math.random() * effectNames.length);
            currentEffect = next;
        }

        async function robustGetUserMedia(c) {
            if (video.srcObject) { video.srcObject.getTracks().forEach(t => { t.stop(); t.onended = null; }); video.srcObject = null; }
            try { return await navigator.mediaDevices.getUserMedia(c); }
            catch (err) { await new Promise(r => setTimeout(r, 1500)); return await navigator.mediaDevices.getUserMedia(c); }
        }

        const mapX = (px) => currentFacing === 'user' ? (1 - px) * canvas.width : px * canvas.width;
        const mapY = (py) => py * canvas.height;

        function drawVideoCover(targetCtx, srcVideo, w, h) {
            const vw = srcVideo.videoWidth, vh = srcVideo.videoHeight;
            if (!vw || !vh) return;
            const scale = Math.max(w / vw, h / vh);
            const sw = vw * scale, sh = vh * scale;
            const sx = (w - sw) / 2, sy = (h - sh) / 2;
            targetCtx.save();
            if (currentFacing === 'user') {
                targetCtx.translate(w, 0); targetCtx.scale(-1, 1);
                targetCtx.drawImage(srcVideo, w - sx - sw, sy, sw, sh);
            } else {
                targetCtx.drawImage(srcVideo, sx, sy, sw, sh);
            }
            targetCtx.restore();
        }

        function drawSkeleton(hand) {
            ctx.strokeStyle = isFrozen ? 'rgba(150, 150, 150, 0.6)' : 'rgba(255, 255, 255, 0.6)'; 
            ctx.lineWidth = 2;
            ctx.beginPath();
            HAND_CONNECTIONS.forEach(([i, j]) => {
                ctx.moveTo(mapX(hand[i].x), mapY(hand[i].y));
                ctx.lineTo(mapX(hand[j].x), mapY(hand[j].y));
            });
            ctx.stroke();
            ctx.fillStyle = isFrozen ? '#888888' : '#FFFFFF';
            hand.forEach(pt => { ctx.beginPath(); ctx.arc(mapX(pt.x), mapY(pt.y), 3, 0, Math.PI * 2); ctx.fill(); });
        }

        function onResults(results) {
            lastHeartbeat = Date.now();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Adaptive Resolution Math
            const now = performance.now();
            const delta = now - lastFrameTime;
            lastFrameTime = now;
            frameTimes.push(delta);
            if (frameTimes.length > 15) frameTimes.shift();
            const avgDelta = frameTimes.reduce((a,b)=>a+b) / frameTimes.length;
            if (frameTimes.length === 15) {
                if (avgDelta > 33 && renderScale > 0.4) renderScale -= 0.05;
                else if (avgDelta < 22 && renderScale < 1.0) renderScale += 0.05;
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusBox.classList.add('active');
                if (idleTimer) clearTimeout(idleTimer);

                if (!isFrozen) results.multiHandLandmarks.forEach(hand => drawSkeleton(hand));

                if (results.multiHandLandmarks.length === 2) {
                    const hands = results.multiHandLandmarks.sort((a, b) => a[8].x - b[8].x);
                    const h1 = hands[0], h2 = hands[1];

                    // Manual Gestures
                    const m1 = isFingerExt(h1, 12, 10), m2 = isFingerExt(h2, 12, 10);
                    const p1 = isFingerExt(h1, 20, 18), p2 = isFingerExt(h2, 20, 18);
                    
                    if (m1 && m2) currentEffect = 3; // Pixel
                    else if (m1) currentEffect = 1; // Invert
                    else if (m2) currentEffect = 2; // ASCII
                    else if (p1 && p2) currentEffect = 4; // Manga
                    else {
                        // Angle Randomizer (Only if no manual gesture)
                        let currentAngle = Math.atan2(h2[8].y - h1[8].y, h2[8].x - h1[8].x) * 180 / Math.PI;
                        if (Math.abs(currentAngle - lastCycleAngle) > 25) {
                            randomizeEffect();
                            lastCycleAngle = currentAngle;
                        }
                    }

                    const p1_4 = h1[4], p2_8 = h1[8], p3_8 = h2[8], p4_4 = h2[4];
                    let pts = [p1_4, p2_8, p3_8, p4_4].map(p => ({ x: mapX(p.x), y: mapY(p.y) }));

                    // Freeze Double-Tap Logic
                    const distIndex = Math.hypot(h1[8].x - h2[8].x, h1[8].y - h2[8].y);
                    if (distIndex < 0.05 && !tapCooldown) {
                        tapCooldown = true;
                        if (Date.now() - lastTapTime < 400) {
                            isFrozen = !isFrozen;
                            if (isFrozen) frozenPts = pts.map(p => ({...p}));
                        } else {
                            lastTapTime = Date.now();
                        }
                        setTimeout(() => tapCooldown = false, 600);
                    }

                    if (isFrozen) pts = frozenPts;

                    // Intensity Math (Area of Polygon)
                    let area = 0;
                    for (let i = 0; i < pts.length; i++) {
                        const j = (i + 1) % pts.length;
                        area += pts[i].x * pts[j].y;
                        area -= pts[j].x * pts[i].y;
                    }
                    area = Math.abs(area / 2);
                    const maxArea = (canvas.width * canvas.height) / 3;
                    const intensity = Math.min(1, area / maxArea);

                    // Apply Effect inside Clip
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y);
                    ctx.lineTo(pts[2].x, pts[2].y); ctx.lineTo(pts[3].x, pts[3].y);
                    ctx.closePath();
                    ctx.clip();
                    applyEffect(intensity);
                    ctx.restore();

                    // Border (Grey if frozen, White if live)
                    ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 6;
                    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y); ctx.lineTo(pts[2].x, pts[2].y); ctx.lineTo(pts[3].x, pts[3].y); ctx.closePath(); ctx.stroke();

                    ctx.strokeStyle = isFrozen ? '#888888' : '#FFFFFF'; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y); ctx.lineTo(pts[2].x, pts[2].y); ctx.lineTo(pts[3].x, pts[3].y); ctx.closePath(); ctx.stroke();

                    // Telemetry HUD Update
                    statusDiv.innerText = `FX: ${effectNames[currentEffect]} | INTENSITY: ${Math.round(intensity*100)}%`;
                    modeDiv.innerText = `STATE: ${isFrozen ? 'FROZEN' : 'LIVE'}`;
                } else {
                    statusDiv.innerText = `FX: ${effectNames[currentEffect]} | INTENSITY: 0%`;
                    modeDiv.innerText = `STATE: ${isFrozen ? 'FROZEN' : 'LIVE'}`;
                }

                if (!isFrozen) {
                    ctx.fillStyle = '#FFFFFF';
                    results.multiHandLandmarks.forEach(hand => {
                        [4, 8].forEach(joint => {
                            ctx.beginPath();
                            ctx.arc(mapX(hand[joint].x), mapY(hand[joint].y), 6, 0, Math.PI * 2);
                            ctx.fill();
                        });
                    });
                }
            } else {
                if (!isFrozen) {
                    idleTimer = setTimeout(() => statusBox.classList.remove('active'), 2000);
                    statusDiv.innerText = `FX: ${effectNames[currentEffect]} | INTENSITY: 0%`;
                    modeDiv.innerText = `STATE: ${isFrozen ? 'FROZEN' : 'IDLE'}`;
                }
            }
        }

        function applyEffect(intensity) {
            const w = canvas.width, h = canvas.height;
            const scaleW = Math.floor(w * renderScale), scaleH = Math.floor(h * renderScale);
            
            if (currentEffect === 0) { // THERMAL
                drawVideoCover(offCtx, video, scaleW, scaleH);
                const imgData = offCtx.getImageData(0, 0, scaleW, scaleH);
                const d = imgData.data;
                const threshold = 0.5 - (intensity * 0.2); // Intensity shifts threshold
                for (let i = 0; i < d.length; i += 4) {
                    const v = (d[i] + d[i+1] + d[i+2]) / 3 / 255; 
                    if (v < threshold) { d[i] = 255 * (v / threshold); d[i+1] = 0; d[i+2] = 255 * (1 - (v / threshold)); } 
                    else { d[i] = 255; d[i+1] = 255 * ((v - threshold) / (1 - threshold)); d[i+2] = 0; }
                }
                offCtx.putImageData(imgData, 0, 0);
                ctx.drawImage(offCanvas, 0, 0, w, h);
            } 
            else if (currentEffect === 1) { // INVERT
                drawVideoCover(offCtx, video, scaleW, scaleH);
                const imgData = offCtx.getImageData(0, 0, scaleW, scaleH);
                const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    // Partial invert based on intensity
                    d[i] = (255 - d[i]) * intensity + d[i] * (1 - intensity);
                    d[i+1] = (255 - d[i+1]) * intensity + d[i+1] * (1 - intensity);
                    d[i+2] = (255 - d[i+2]) * intensity + d[i+2] * (1 - intensity);
                }
                offCtx.putImageData(imgData, 0, 0);
                ctx.drawImage(offCanvas, 0, 0, w, h);
            }
            else if (currentEffect === 2) { // ASCII
                ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#FFFFFF'; 
                const fontSize = Math.floor(6 + intensity * 14); // 6px to 20px
                ctx.font = `${fontSize}px "JetBrains Mono", monospace`;
                drawVideoCover(tinyCtx, video, 160, 120);
                const imgData = tinyCtx.getImageData(0, 0, 160, 120).data;
                const chars = " .:-=+*#%@";
                const cellW = w / 160, cellH = h / 120;
                for(let y=0; y<120; y++) {
                    for(let x=0; x<160; x++) {
                        const i = (y * 160 + x) * 4;
                        const v = (imgData[i] + imgData[i+1] + imgData[i+2]) / 3;
                        const c = chars[Math.floor((v/255) * (chars.length-1))];
                        ctx.fillText(c, x * cellW, (y+1) * cellH);
                    }
                }
            }
            else if (currentEffect === 3) { // CARTOON PIXEL
                // Intensity controls pixel chunkiness
                const pixW = Math.floor(160 - intensity * 120); // 160 down to 40
                const pixH = Math.floor(120 - intensity * 90);
                drawVideoCover(tinyCtx, video, pixW, pixH);
                const imgData = tinyCtx.getImageData(0, 0, pixW, pixH).data;
                for(let i=0; i<imgData.length; i+=4) {
                    imgData[i] = Math.floor(imgData[i] / 64) * 64;
                    imgData[i+1] = Math.floor(imgData[i+1] / 64) * 64;
                    imgData[i+2] = Math.floor(imgData[i+2] / 64) * 64;
                }
                tinyCtx.putImageData(new ImageData(imgData, pixW, pixH), 0, 0);
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(tinyCanvas, 0, 0, w, h);
                ctx.imageSmoothingEnabled = true;
            }
            else if (currentEffect === 4) { // MANGA HALFTONE
                drawVideoCover(offCtx, video, scaleW, scaleH);
                const imgData = offCtx.getImageData(0, 0, scaleW, scaleH);
                const d = imgData.data;
                const threshold = 120 - (intensity * 40); // Intensity increases contrast
                for (let i = 0; i < d.length; i += 4) {
                    const v = (d[i] + d[i+1] + d[i+2]) / 3;
                    const c = v > threshold ? 255 : 0; 
                    d[i] = c; d[i+1] = c; d[i+2] = c;
                }
                offCtx.putImageData(imgData, 0, 0);
                ctx.drawImage(offCanvas, 0, 0, w, h);
                
                ctx.fillStyle = '#000000';
                const step = Math.floor(6 + intensity * 10); // Intensity controls dot size
                for (let y = 0; y < h; y += step) {
                    for (let x = 0; x < w; x += step) {
                        const offset = (y / step) % 2 === 0 ? 0 : step / 2;
                        ctx.beginPath();
                        ctx.arc(x + offset, y, step / 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        function runBootSequence() {
            const bar = document.getElementById('load-bar');
            const percent = document.getElementById('load-percent');
            let progress = 0;
            const interval = setInterval(() => {
                progress += 1;
                percent.innerText = `${progress}%`;
                bar.style.width = `${progress}%`;
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => { loader.classList.add('hide'); checkOrientation(); }, 500);
                }
            }, 50); 
        }

        async function initializeHandTracking() {
            if (document.documentElement.requestFullscreen) { try { await document.documentElement.requestFullscreen(); } catch(e){} }
            initBtn.style.display = 'none';
            await buildMediaPipe();
        }

        async function buildMediaPipe() {
            try {
                if (handsInstance) { try { await handsInstance.close(); } catch(e){} handsInstance = null; }
                handsInstance = new Hands({ locateFile: (file) => `/assets/${file}` });
                handsInstance.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
                handsInstance.onResults(onResults);
                lastHeartbeat = Date.now(); isRecovering = false;
                statusDiv.innerText = `FX: ${effectNames[currentEffect]} | INTENSITY: 0%`;
                modeDiv.innerText = `STATE: IDLE`;
                processFrame();
            } catch (err) { console.error("FATAL:", err); }
        }

        async function processFrame() {
            if (!isRecovering && (Date.now() - lastHeartbeat) > 2500) {
                isRecovering = true; modeDiv.innerText = "STATE: REBOOTING";
                await new Promise(r => setTimeout(r, 2000)); await buildMediaPipe(); return;
            }
            if (!isRecovering) {
                try { if (video.readyState >= 2 && handsInstance) await handsInstance.send({ image: video }); }
                catch (err) { lastHeartbeat = 0; }
            }
            requestAnimationFrame(processFrame);
        }

        async function switchCamera() {
            currentFacing = currentFacing === 'user' ? 'environment' : 'user';
            video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
            try { const stream = await robustGetUserMedia({ video: { facingMode: currentFacing, width: {ideal: 640}, height: {ideal: 480}}}); video.srcObject = stream; await video.play(); }
            catch(e) { modeDiv.innerText = "STATE: CAM ERR"; }
        }

        async function boot() {
            try {
                const stream = await robustGetUserMedia({ video: { facingMode: currentFacing, width: { ideal: 320 }, height: { ideal: 240 } }});
                video.srcObject = stream; await video.play();
                video.style.display = 'block'; if (currentFacing === 'user') video.style.transform = 'scaleX(-1)';
                runBootSequence();
            } catch (err) { 
                document.getElementById('load-percent').innerText = 'ERROR'; 
                document.getElementById('load-step').innerText = err.message; 
                document.getElementById('load-percent').style.color = '#ff5555'; 
            }
        }
        boot();
    </script>
</body>
</html>
