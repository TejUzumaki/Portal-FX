<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal FX</title>
    <link rel="stylesheet" href="style.css">
    <script src="/assets/hands.js"></script>
</head>
<body>
    <div id="loader">
        <div id="load-percent">0%</div>
        <div id="load-step">Initializing</div>
        <div id="load-bar-bg"><div id="load-bar"></div></div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="ui-layer">
        <div id="status-box">
            <div id="status">SYSTEM READY</div>
            <div id="mode">TRACKING</div>
        </div>

        <button id="btn-cam" class="hud-btn" onclick="switchCamera()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </button>
        <button id="btn-fx" class="hud-btn active" onclick="cycleEffect()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"></circle><path d="M14.31 8l5.74 9.94M9.69 8h11.48M7.38 12l5.74-9.94M9.69 16L3.95 6.06M14.31 16H2.83M16.62 12l-5.74 9.94"></path></svg>
        </button>

        <button id="init-btn" onclick="initializeHandTracking()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg>
            <span>Start</span>
        </button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const loader = document.getElementById('loader');
        const loadPercent = document.getElementById('load-percent');
        const loadStep = document.getElementById('load-step');
        const initBtn = document.getElementById('init-btn');
        const statusDiv = document.getElementById("status");
        const modeDiv = document.getElementById("mode");

        let currentFacing = 'user', handsInstance = null;
        let lastHeartbeat = 0, isRecovering = false;
        let currentEffect = 0; // 0: Thermal, 1: Polka, 2: Invert
        const effectNames = ["THERMAL", "POLKA", "INVERT"];

        // Offscreen canvas for pixel manipulation
        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            offCanvas.width = window.innerWidth;
            offCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function cycleEffect() {
            currentEffect = (currentEffect + 1) % 3;
            modeDiv.innerText = effectNames[currentEffect];
        }

        async function robustGetUserMedia(c) {
            if (video.srcObject) { video.srcObject.getTracks().forEach(t => { t.stop(); t.onended = null; }); video.srcObject = null; }
            try { return await navigator.mediaDevices.getUserMedia(c); }
            catch (err) { await new Promise(r => setTimeout(r, 1500)); return await navigator.mediaDevices.getUserMedia(c); }
        }

        function onResults(results) {
            lastHeartbeat = Date.now();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length === 2) {
                // Sort hands by X coordinate to ensure consistent Left/Right mapping
                const hands = results.multiHandLandmarks.sort((a, b) => a[8].x - b[8].x);
                
                // Left Hand (appears on right side of screen due to mirror, but math is same)
                const p1 = hands[0][4]; // Left Thumb
                const p2 = hands[0][8]; // Left Index
                // Right Hand
                const p3 = hands[1][8]; // Right Index
                const p4 = hands[1][4]; // Right Thumb

                const w = canvas.width, h = canvas.height;
                // Convert normalized coords to canvas coords
                const pts = [p1, p2, p3, p4].map(p => ({ x: (1 - p.x) * w, y: p.y * h }));

                // 1. Save state, clip to the 4-point polygon
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                ctx.lineTo(pts[2].x, pts[2].y);
                ctx.lineTo(pts[3].x, pts[3].y);
                ctx.closePath();
                ctx.clip();

                // 2. Apply the selected effect inside the clip
                applyEffect();

                // 3. Restore state (removes clip)
                ctx.restore();

                // 4. Draw the crisp White outline of the rectangle
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                ctx.lineTo(pts[2].x, pts[2].y);
                ctx.lineTo(pts[3].x, pts[3].y);
                ctx.closePath();
                ctx.stroke();

                statusDiv.innerText = "PORTAL ACTIVE";
            } else {
                statusDiv.innerText = "SHOW 2 HANDS";
            }
        }

        function applyEffect() {
            if (currentEffect === 0) { // Thermal
                offCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imgData = offCtx.getImageData(0, 0, canvas.width, canvas.height);
                const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    const v = (d[i] + d[i+1] + d[i+2]) / 3 / 255; // brightness 0-1
                    // Purple to Orange to Yellow gradient
                    if (v < 0.5) {
                        d[i] = 255 * (v * 2); // R
                        d[i+1] = 0; // G
                        d[i+2] = 255 * (1 - (v * 2)); // B
                    } else {
                        d[i] = 255; // R
                        d[i+1] = 255 * ((v - 0.5) * 2); // G
                        d[i+2] = 0; // B
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            } 
            else if (currentEffect === 1) { // Polka Dots
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFFFFF';
                const step = 30;
                for (let y = 0; y < canvas.height; y += step) {
                    for (let x = 0; x < canvas.width; x += step) {
                        const offset = (y / step) % 2 === 0 ? 0 : step / 2;
                        ctx.beginPath();
                        ctx.arc(x + offset, y, 6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            } 
            else if (currentEffect === 2) { // Invert
                offCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imgData = offCtx.getImageData(0, 0, canvas.width, canvas.height);
                const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    d[i] = 255 - d[i];
                    d[i+1] = 255 - d[i+1];
                    d[i+2] = 255 - d[i+2];
                }
                ctx.putImageData(imgData, 0, 0);
            }
        }

        async function initializeHandTracking() {
            // Auto Fullscreen on user interaction
            if (document.documentElement.requestFullscreen) {
                try { await document.documentElement.requestFullscreen(); } catch(e){}
            }

            initBtn.style.display = 'none';
            await buildMediaPipe();
        }

        async function buildMediaPipe() {
            try {
                if (handsInstance) { try { await handsInstance.close(); } catch(e){} handsInstance = null; }
                handsInstance = new Hands({ locateFile: (file) => `/assets/${file}` });
                handsInstance.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.5 });
                handsInstance.onResults(onResults);
                lastHeartbeat = Date.now(); isRecovering = false;
                statusDiv.innerText = "AI ONLINE";
                modeDiv.innerText = effectNames[currentEffect];
                processFrame();
            } catch (err) { console.error("FATAL:", err); }
        }

        async function processFrame() {
            if (!isRecovering && (Date.now() - lastHeartbeat) > 2500) {
                isRecovering = true; statusDiv.innerText = "REBOOTING...";
                await new Promise(r => setTimeout(r, 2000)); await buildMediaPipe(); return;
            }
            if (!isRecovering) {
                try { if (video.readyState >= 2 && handsInstance) await handsInstance.send({ image: video }); }
                catch (err) { lastHeartbeat = 0; }
            }
            requestAnimationFrame(processFrame);
        }

        async function switchCamera() {
            currentFacing = currentFacing === 'user' ? 'environment' : 'user';
            video.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
            canvas.style.transform = currentFacing === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
            try { const stream = await robustGetUserMedia({ video: { facingMode: currentFacing, width: {ideal: 640}, height: {ideal: 480}}}); video.srcObject = stream; await video.play(); }
            catch(e) { statusDiv.innerText = "CAM ERR"; }
        }

        async function boot() {
            try {
                loadPercent.innerText = '20%'; loadStep.innerText = 'Loading Engine';
                loadPercent.innerText = '60%'; loadStep.innerText = 'Starting Camera';
                const stream = await robustGetUserMedia({ video: { facingMode: currentFacing, width: { ideal: 320 }, height: { ideal: 240 } }});
                video.srcObject = stream; await video.play();
                video.style.display = 'block'; if (currentFacing === 'user') video.style.transform = 'scaleX(-1)';
                loader.style.display = 'none';
            } catch (err) { loadPercent.innerText = 'ERROR'; loadStep.innerText = err.message; loadPercent.style.color = '#ff5555'; }
        }
        boot();
    </script>
</body>
</html>
